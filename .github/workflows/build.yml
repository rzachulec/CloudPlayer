name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel
    env:
      APP_NAME: CloudPlayer
      CERT_NAME: CloudPlayer Self-Signed
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (${{ matrix.arch }})
        run: |
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS=${{ matrix.arch }} ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="build/Build/Products/Release/$APP_NAME.app"
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create self-signed certificate
        run: |
          WORK="$RUNNER_TEMP/sign"; mkdir -p "$WORK"; cd "$WORK"
          cat > cert.cnf <<CNF
          [req]
          distinguished_name=dn
          x509_extensions=ext
          prompt=no
          [dn]
          CN=$CERT_NAME
          [ext]
          basicConstraints=critical,CA:false
          keyUsage=critical,digitalSignature
          extendedKeyUsage=critical,codeSigning
          CNF
          # System LibreSSL writes a PKCS#12 the macOS keychain can import.
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout key.pem -out cert.pem -config cert.cnf
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem \
            -out cert.p12 -passout pass:ci -name "$CERT_NAME"

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          rm -f key.pem cert.p12

          # The cert is untrusted, so address the identity by its SHA-1 hash.
          HASH=$(security find-identity -p codesigning "$KEYCHAIN" | awk -v n="\"$CERT_NAME\"" 'index($0, n) {print $2; exit}')
          test -n "$HASH"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Sign app
        run: |
          codesign --force --deep --timestamp=none \
            --keychain "$KEYCHAIN" --sign "$SIGN_HASH" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|Identifier'

      - name: Package
        run: |
          ZIP="$APP_NAME-macos-${{ matrix.label }}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-${{ matrix.label }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    name: Publish "latest" release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Self-signed build of ${GITHUB_SHA} from main. See the README for how to run it." \
            --prerelease
