name: CI & Nightly Stage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    uses: ./.github/workflows/_build.yml

  nightly:
    name: Publish nightly stage release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "$(cat <<EOF
          Rolling staging build from \`main\` (\`${SHORT_SHA}\`).

          Install or update to this staging build:
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | bash -s -- --nightly
          \`\`\`
          EOF
          )" \
            --prerelease
